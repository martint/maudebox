[workspace]
members = ["xtask"]
resolver = "2"

[package]
name = "maudebox"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "maudebox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

# No dependencies on purpose. xtask is a build helper that runs `docker
# build` and `cargo build`; everything it needs lives in std. Adding crates
# would slow `cargo xtask` cold-starts on a fresh checkout for no benefit.
[dependencies]
